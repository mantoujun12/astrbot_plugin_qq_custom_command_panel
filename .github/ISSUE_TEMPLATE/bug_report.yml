name: 🐛 Bug 反馈
description: 报告使用插件过程中遇到的 Bug 或异常行为
title: "[Bug] "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        感谢提交 Bug 反馈！在提交前，请先：
        - 确认已查阅 [README](https://github.com/mantoujun12/astrbot_plugin_qq_custom_command_panel#readme) 的「已知限制」和「调试指令」章节
        - 在 [Issue 列表](https://github.com/mantoujun12/astrbot_plugin_qq_custom_command_panel/issues) 中搜索过相似问题

  - type: checkboxes
    id: prerequisites
    attributes:
      label: 前置确认
      description: 请确认以下条件全部满足后再提交
      options:
        - label: 我已查阅 README 文档，包括已知限制和调试指令
          required: true
        - label: 我已搜索现有 Issues，未找到相似问题
          required: true
        - label: 这是 Bug 反馈，而非功能请求或使用提问
          required: true

  - type: textarea
    id: description
    attributes:
      label: Bug 描述
      description: 清晰简洁地描述遇到的问题现象
    validations:
      required: true

  - type: textarea
    id: reproduce
    attributes:
      label: 复现步骤
      description: 详细描述复现此问题的操作步骤
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: 预期行为
      description: 描述你期望发生的正常行为
    validations:
      required: true

  - type: dropdown
    id: scene
    attributes:
      label: 受影响的场景
      description: Bug 出现在哪些面板场景中（可多选）
      multiple: true
      options:
        - c2c (单聊)
        - group (群聊)
        - channel (文字子频道)
        - dm (频道私信)
        - 与场景无关
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: 日志 / 错误输出
      description: 粘贴 AstrBot 控制台或日志文件中带 [qq-command-panel] 前缀的相关输出
      render: text
      placeholder: |
        [2026-08-29 10:00:00] [qq-command-panel] Failed to sync panel for appid xxxxxx
        ...
    validations:
      required: false

  - type: input
    id: plugin_version
    attributes:
      label: 插件版本
      description: 可从 AstrBot 插件信息查看
    validations:
      required: true

  - type: input
    id: astrbot_version
    attributes:
      label: AstrBot 版本
      description: 你的 AstrBot 主程序版本
    validations:
      required: true

  - type: textarea
    id: additional
    attributes:
      label: 补充信息
      description: 其他有助于定位问题的信息（截图、截图中文字版、参考链接等）
    validations:
      required: false
