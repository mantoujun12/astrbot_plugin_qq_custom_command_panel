name: CI

on:
  push:
    branches:
      - main
      - master
  pull_request:

permissions:
  contents: read

jobs:
  lint:
    name: Lint (pre-commit)
    # pre-commit.ci 只覆盖 PR; 本 job 兜底直接 push 到 main/master 的提交,
    # 并在 pre-commit.ci 服务不可用时保证 ruff 检查仍然执行
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install pre-commit
        run: |
          python -m pip install --upgrade pip
          pip install pre-commit

      - name: Run hooks (includes ruff check + format)
        run: pre-commit run --all-files --show-diff-on-failure

  test:
    name: Pytest (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt

      - name: Run tests with coverage
        run: pytest --cov --cov-branch --cov-report=xml

      # 只在单个矩阵任务上传, 避免同一 commit 多次提交覆盖率报告
      - name: Upload coverage to Codecov
        if: ${{ matrix.python-version == '3.12' }}
        uses: codecov/codecov-action@v7
        with:
          files: ./coverage.xml
          flags: unittests
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: false

  dashboard:
    name: Dashboard (build + freshness)
    # AstrBot 直接读取提交进仓库的 pages/dashboard/, 所以这里既要确认能构建,
    # 也要确认提交的产物和源码一致 (源码改了但忘记重新 build 会让 CI 变红)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 12

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: web/dashboard/pnpm-lock.yaml

      - name: Install dependencies
        working-directory: web/dashboard
        run: pnpm install --frozen-lockfile

      - name: Build dashboard
        working-directory: web/dashboard
        run: pnpm build

      - name: Check committed bundle is up to date
        run: |
          if [ -n "$(git status --porcelain -- pages/dashboard)" ]; then
            echo "::error::pages/dashboard is out of date. Run 'pnpm build' in web/dashboard and commit the result."
            git --no-pager status --porcelain -- pages/dashboard
            git --no-pager diff --stat -- pages/dashboard
            exit 1
          fi
          echo "pages/dashboard is up to date."
