name: CI Dashboard

on:
  push:
    branches:
      - master
  pull_request:

permissions:
  contents: read

jobs:
  dashboard:
    name: Dashboard - Build (Node ${{ matrix.node-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: ["24"]
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 12

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}
          cache: pnpm
          cache-dependency-path: web/dashboard/pnpm-lock.yaml

      - name: Install dependencies
        working-directory: web/dashboard
        run: pnpm install --frozen-lockfile

      - name: Build dashboard
        working-directory: web/dashboard
        run: pnpm build
