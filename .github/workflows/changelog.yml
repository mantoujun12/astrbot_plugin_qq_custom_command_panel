name: Update CHANGELOG

on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  changelog:
    name: Generate CHANGELOG.md
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Generate changelog from releases
        id: build_changelog
        uses: mikepenz/release-changelog-builder-action@v6
        with:
          configuration: .github/changelog-configuration.json
          outputFile: CHANGELOG.md
          failOnError: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Commit CHANGELOG.md
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          if [ ! -f CHANGELOG.md ]; then
            echo "CHANGELOG.md was not generated, skipping commit."
            exit 0
          fi

          if git diff --quiet CHANGELOG.md; then
            echo "No changes to CHANGELOG.md, skipping commit."
            exit 0
          fi

          git add CHANGELOG.md
          git commit -m "docs: update CHANGELOG.md for release ${{ github.event.release.tag_name }}"
          git push
